name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Restore root files if missing
        run: cp -n tools/rootfiles/* .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore engine and voice pack cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/talking-cat-engine
          key: cat-engine-v2-${{ github.run_number }}
          restore-keys: |
            cat-engine-v2-
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" || true
      - name: Build debug APK
        env:
          PREGEN_MINUTES: '270'
          PREGEN_STEPS: '8'
          PREGEN_VOICES: '9,1,3,6,7'
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx3g assembleDebug
      - name: Save engine and voice pack cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/talking-cat-engine
          key: cat-engine-v2-${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: talking-cat-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload pronunciation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-report
          path: pack-report.txt
          if-no-files-found: ignore
